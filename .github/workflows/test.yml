name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tooling claims to run "wherever Python 3 does" and ships no
        # dependencies, so prove that across the range *and* across operating
        # systems. A Linux-only matrix already let one platform bug ship: an
        # unguarded `os.O_NOFOLLOW` raised AttributeError on Windows before
        # anything else ran, and a reviewer found it by reading the code because
        # no runner could.
        #
        # Deliberately not a full cross product. Linux carries the version range,
        # because a 3.9-versus-3.13 difference is an interpreter difference and
        # shows up anywhere. macOS and Windows run one version each, because what
        # they are here to test is the operating system. Six cells would take four
        # times as long to say the same thing.
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # PyYAML is a *test* dependency only. The tooling ships a lenient reader
      # with no dependencies; the tests need a strict one to catch notes that
      # this plugin can read and Obsidian cannot.
      - run: pip install pytest pyyaml
      # This job is also where the hooks are executed, not just parsed —
      # `tests/test_hooks_execute.py` runs the command strings out of
      # hooks.json. Deliberately here rather than as a step of its own: the
      # always-on surface is the last thing that should be proven on one
      # platform, and this matrix is what makes it four.
      - run: python -m pytest tests/ -q

  shell:
    # Stays Linux-only on purpose, and is not an oversight the next reader should
    # fix: `bin/` and `vault_init.sh` are bash, and running `bash -n` on a Windows
    # runner would be checking Git Bash's parser rather than anything a user of
    # this plugin runs. The pytest matrix above is where platform coverage lives.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bin/ wrappers and vault_init.sh parse
        run: |
          for f in bin/* scripts/vault_init.sh; do bash -n "$f"; done
      - name: bin/ wrappers are executable
        run: |
          for f in bin/*; do test -x "$f" || { echo "$f is not executable"; exit 1; }; done

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json is valid JSON
        run: python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
      - name: marketplace.json is valid JSON
        run: python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
      - name: hooks.json is valid JSON
        run: python -c "import json; json.load(open('hooks/hooks.json'))"

      # The JSON checks above are strictly weaker than what the CLI does. It
      # parses every skill and agent's frontmatter, and a YAML error there is
      # invisible at runtime: Claude Code drops the whole block and the skill
      # loads nameless, so it simply never triggers. Not preinstalled on the
      # runner, and not authenticated — validate is a local schema check.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      # Both manifests, each named explicitly. `validate .` is not enough and is
      # actively misleading: with a marketplace.json present it validates *only*
      # the marketplace and stops checking the plugin — so adding the marketplace
      # silently retired this job's real check. Found by running it.
      - name: claude plugin validate (plugin)
        run: claude plugin validate ./.claude-plugin/plugin.json
      # --strict here but not above, because the plugin manifest emits a warning
      # about CLAUDE.md that this repo keeps deliberately; see CLAUDE.md itself.
      - name: claude plugin validate (marketplace)
        run: claude plugin validate ./.claude-plugin/marketplace.json --strict
